<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Create Account | AI Resume Screening System</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(135deg, #1d2671, #c33764);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .signup-card {
            width: 100%;
            max-width: 440px;
            padding: 32px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(12px);
            border-radius: 18px;
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.25);
            color: #fff;
        }

        .brand {
            text-align: center;
            margin-bottom: 24px;
        }

        .brand h1 {
            margin: 0;
            font-size: 1.6rem;
            font-weight: 600;
        }

        .brand p {
            font-size: 0.9rem;
            opacity: 0.85;
            margin-top: 6px;
        }

        .form-group {
            margin-bottom: 14px;
        }

        label {
            display: block;
            font-size: 0.85rem;
            margin-bottom: 6px;
        }

        input {
            width: 100%;
            padding: 12px 14px;
            border-radius: 10px;
            border: none;
            outline: none;
            font-size: 0.95rem;
        }

        input::placeholder {
            color: #999;
        }

        .btn {
            width: 100%;
            padding: 13px;
            margin-top: 12px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #ff512f, #dd2476);
            color: #fff;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }

        .footer {
            text-align: center;
            margin-top: 16px;
            font-size: 0.85rem;
        }

        .footer a {
            color: #fff;
            text-decoration: underline;
            font-weight: 500;
        }

        .error {
            background: rgba(255, 0, 0, 0.15);
            color: #ffdede;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 14px;
            font-size: 0.85rem;
            text-align: center;
        }

        /* 📱 Mobile optimization */
        @media (max-width: 480px) {
            .signup-card {
                padding: 24px;
            }

            .brand h1 {
                font-size: 1.4rem;
            }
        }
    </style>
</head>

<body>

<div class="signup-card">

    <div class="brand">
        <h1>AI Resume System</h1>
        <p>Create your recruiter account</p>
    </div>

    {% if error %}
        <div class="error">{{ error }}</div>
    {% endif %}

    <form method="POST" action="/signup">

        <div class="form-group">
            <label>Full Name</label>
            <input type="text" name="name" placeholder="John Doe" required>
        </div>

        <div class="form-group">
            <label>Email Address</label>
            <input type="email" name="email" placeholder="hr@company.com" required>
        </div>

        <div class="form-group">
            <label>Password</label>
            <input type="password" name="password" placeholder="Minimum 8 characters" required>
        </div>

        <button type="submit" class="btn">Create Account</button>
    </form>

    <div class="footer">
        Already have an account? <a href="/login">Login</a>
    </div>

</div>

</body>
</html>
